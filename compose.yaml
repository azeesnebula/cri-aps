name: cri-pumps

services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: cri
      POSTGRES_PASSWORD: ${CRI_DB_PASSWORD:-cri-local-development}
      POSTGRES_DB: postgres
    volumes:
      - cri-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cri -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build: .
    ports:
      - "127.0.0.1:${CRI_PORT:-8081}:80"
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: cri
      POSTGRES_PASSWORD: ${CRI_DB_PASSWORD:-cri-local-development}
      POSTGRES_DBNAME: cri
      FREPPLE_TIME_ZONE: Asia/Kolkata
      FREPPLE_DATE_STYLE: day-month-year
      FREPPLE_THEMES: snow
      FREPPLE_DEFAULT_THEME: snow
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - cri-logs:/var/log/frepple
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/data/login/"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  cri-database:
  cri-logs:
